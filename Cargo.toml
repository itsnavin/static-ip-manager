[package]
name = "static-ip-manager"
version = "0.1.0"
edition = "2024"
description = "Safe GUI for configuring static IPv4 settings on Windows and Linux"
license = "MIT"
repository = "https://github.com/itsnavin/static-ip-manager"

[lib]
name = "static_ip_manager"
path = "src/lib.rs"

[[bin]]
name = "static-ip-manager"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
name = "static-ip-manager"
maintainer = "itsnavin"
copyright = "2026, itsnavin"
license-file = ["LICENSE", "0"]
depends = "$auto, policykit-1 | polkitd"
section = "net"
priority = "optional"
extended-description = "Desktop GUI to set a static IPv4 configuration with backup, preview and automatic rollback. Supports NetworkManager, netplan, systemd-networkd and dhcpcd."
assets = [
  ["target/release/static-ip-manager", "usr/bin/", "755"],
  ["packaging/static-ip-manager.desktop", "usr/share/applications/", "644"],
  ["README.md", "usr/share/doc/static-ip-manager/README", "644"],
]
