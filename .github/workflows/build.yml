name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64, deb: amd64 }
          - { os: ubuntu-22.04-arm, arch: aarch64, deb: arm64 }
          - { os: windows-latest, arch: x86_64 }
          - { os: windows-11-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - name: Syntax-check generated shell scripts
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/sipm-scripts
          cargo run --example dump -- /tmp/sipm-scripts
          for f in /tmp/sipm-scripts/*.sh; do sh -n "$f" && echo "ok $f"; done
      - run: cargo build --release
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/static-ip-manager dist/static-ip-manager-linux-${{ matrix.arch }}
          tar -C dist -czf dist/static-ip-manager-linux-${{ matrix.arch }}.tar.gz static-ip-manager-linux-${{ matrix.arch }}
          rm dist/static-ip-manager-linux-${{ matrix.arch }}
          cargo install cargo-deb --locked
          cargo deb --no-build -o dist/static-ip-manager_${{ matrix.deb }}.deb
          # AppImage
          mkdir -p AppDir/usr/bin
          cp target/release/static-ip-manager AppDir/usr/bin/
          cp packaging/static-ip-manager.desktop AppDir/
          sed -i 's/^Icon=.*/Icon=static-ip-manager/' AppDir/static-ip-manager.desktop
          convert -size 256x256 xc:'#388bfd' AppDir/static-ip-manager.png
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/static-ip-manager" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
          chmod +x appimagetool
          ARCH=${{ matrix.arch }} ./appimagetool --appimage-extract-and-run AppDir dist/static-ip-manager-${{ matrix.arch }}.AppImage
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/static-ip-manager.exe dist/static-ip-manager-windows-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
